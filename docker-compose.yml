services:
  postgres:
    image: postgres:17-alpine
    container_name: skeleton-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skeleton}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-skeleton}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: skeleton-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skeleton-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-skeleton}?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_REQUIRED: 'true'
      PORT: 3000
      HOST: 0.0.0.0
      APP_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3001,http://localhost:5173
      COOKIE_SECRET: ${COOKIE_SECRET:-dev-cookie-secret-change-me-32-chars-min}
      COOKIE_DOMAIN: localhost
      COOKIE_SAMESITE: Strict
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_ACCESS_TTL_SEC: 900
      JWT_REFRESH_TTL_SEC: 2592000
      LOG_LEVEL: info
      OTEL_SERVICE_NAME: nestjs-skeleton
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
